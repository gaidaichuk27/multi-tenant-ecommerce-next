services:
    # Optional bundled Postgres — only with DOCKER_USE_BUNDLED_POSTGRES=1
    postgres:
        profiles:
            - dev-db
        image: postgres:16-alpine
        ports:
            - '5433:5432'
        environment:
            POSTGRES_USER: ${DOCKER_POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: multi-tenant
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    # Production Next.js (UI + tRPC BFF)
    app:
        profiles:
            - prod
        build:
            context: .
            target: runner
        ports:
            - '3000:3000'
        environment:
            NODE_ENV: production
            BACKEND_URL: http://api:8080
        depends_on:
            - api

    # Production Express API — requires DATABASE_URL (root .env or host environment)
    api:
        profiles:
            - prod
        build:
            context: .
            target: backend-runner
        ports:
            - '8080:8080'
        env_file:
            - path: .env
              required: false
            - path: backend/.env
              required: false
        environment:
            NODE_ENV: production
            API_PORT: '8080'
            DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for prod api}

    # Next.js + Express backend with hot reload
    dev:
        profiles:
            - dev
        build:
            context: .
            target: dev
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '3000:3000'
            - '8080:8080'
        volumes:
            - .:/app
            - dev_node_modules:/app/node_modules
            - dev_backend_node_modules:/app/backend/node_modules
            - dev_database_node_modules:/app/packages/database/node_modules
            - dev_api_node_modules:/app/packages/api/node_modules
            - dev_next:/app/.next
        env_file:
            - path: .env
              required: false
            - path: backend/.env
              required: false
        environment:
            NODE_ENV: development
            CI: 'true'
            WATCHPACK_POLLING: 'true'
            CHOKIDAR_USEPOLLING: 'true'
            DATABASE_URL: ${DOCKER_DATABASE_URL}
            BACKEND_URL: http://127.0.0.1:8080
            NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
            NEXT_PUBLIC_API_URL: http://localhost:3000
            API_PORT: '8080'
            STOREFRONT_URL: http://localhost:3000
        command:
            [
                'sh',
                '-c',
                'pnpm install --frozen-lockfile && pnpm db:generate && exec pnpm dev',
            ]

    storybook:
        profiles:
            - storybook
        build:
            context: .
            target: storybook
        ports:
            - '6006:6006'
        volumes:
            - .:/app
            - storybook_node_modules:/app/node_modules
        environment:
            NODE_ENV: development
            CI: 'true'
            WATCHPACK_POLLING: 'true'
        command:
            [
                'sh',
                '-c',
                'pnpm install --frozen-lockfile && exec pnpm exec storybook dev --ci -p 6006 --host 0.0.0.0',
            ]

volumes:
    postgres_data:
    dev_node_modules:
    dev_backend_node_modules:
    dev_database_node_modules:
    dev_api_node_modules:
    dev_next:
    storybook_node_modules:
